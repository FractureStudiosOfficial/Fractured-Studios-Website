<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>U.I.C. // BULLETIN BOARD</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
    --amber:#FF9F07;
    --amberBright:#FFC861;
    --amberDim:#B36700;
    --red:#ff4a2b;
    --green:#8fff8a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;min-height:100%;background:#000;overflow-x:hidden;}
body{color:var(--amber);font-family:'Share Tech Mono',monospace;padding:12px;}

/* CRT overlays (lightweight; skipped on small screens for perf) */
#scanlines{position:fixed;inset:0;pointer-events:none;z-index:1300;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.30) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1100;background:radial-gradient(ellipse 90% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 90%);}
#amber-tint{position:fixed;inset:0;pointer-events:none;z-index:1150;background:radial-gradient(ellipse at 50% 50%,rgba(255,159,7,.03),rgba(255,80,0,.06) 80%);mix-blend-mode:screen;}
@media (max-width:600px){#scanlines{opacity:.6;}}

.wrap{max-width:1200px;margin:0 auto;position:relative;z-index:2;}

/* Header */
#head{padding:14px 16px;border:2px solid rgba(255,159,7,.5);background:linear-gradient(90deg,rgba(255,159,7,.08),rgba(255,74,43,.06));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
#head .brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
#head .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}
#head .title{font-size:20px;letter-spacing:.28em;color:var(--red);text-shadow:0 0 8px rgba(255,74,43,.5);}
#head .sub{font-size:11px;letter-spacing:.22em;color:var(--amberBright);opacity:.75;}
#head .meta{font-size:11px;letter-spacing:.22em;color:var(--amberBright);opacity:.7;}
@media (max-width:600px){
    #head .title{font-size:16px;letter-spacing:.2em;}
    #head .sub{font-size:10px;letter-spacing:.18em;}
    #head{padding:12px;}
}

/* Layout: side-by-side on desktop, stacked on mobile */
.board{display:grid;grid-template-columns:320px 1fr;gap:14px;}
@media (max-width:820px){.board{grid-template-columns:1fr;}}

/* Panels */
.panel{border:2px solid rgba(255,159,7,.45);background:linear-gradient(180deg,rgba(255,159,7,.05),rgba(0,0,0,.4));padding:14px;position:relative;box-shadow:inset 0 0 24px rgba(255,159,7,.04);border-radius:4px;min-height:200px;}
.panel::before{content:"";position:absolute;inset:6px;border:1px dashed rgba(255,159,7,.18);pointer-events:none;border-radius:2px;}
.panel-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px dashed rgba(255,159,7,.3);position:relative;z-index:1;}
.panel-head .tick{color:var(--red);}
.panel-head .ttl{color:var(--amberBright);letter-spacing:.22em;font-size:13px;text-shadow:0 0 4px rgba(255,159,7,.5);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.panel-head .badge{font-size:10px;letter-spacing:.2em;padding:3px 8px;border:1px solid rgba(255,74,43,.4);color:var(--red);}

/* Doc list */
#doc-list{max-height:60vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,159,7,.4) transparent;position:relative;z-index:1;}
#doc-list::-webkit-scrollbar{width:6px;}
#doc-list::-webkit-scrollbar-thumb{background:rgba(255,159,7,.4);}
.doc-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;margin-bottom:6px;border:1px solid rgba(255,159,7,.22);background:rgba(255,159,7,.03);cursor:pointer;font-size:12px;letter-spacing:.1em;gap:8px;transition:background .12s,border-color .12s,color .12s;min-height:44px;}
.doc-row:hover,.doc-row:focus{background:rgba(255,159,7,.14);border-color:rgba(255,159,7,.55);color:var(--amberBright);outline:none;}
.doc-row.active{background:rgba(255,74,43,.12);border-color:rgba(255,74,43,.5);color:var(--red);text-shadow:0 0 4px rgba(255,74,43,.4);}
.doc-row .dname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.doc-row .dico{color:var(--red);width:20px;text-align:center;flex-shrink:0;}
.doc-row.locked .dname::after{content:" 🔒";font-size:11px;}
.doc-row .ddate{font-size:9px;letter-spacing:.16em;color:var(--amberBright);opacity:.55;flex-shrink:0;}
@media (max-width:820px){#doc-list{max-height:36vh;}}

/* Viewer */
#viewer-wrap{min-height:300px;position:relative;z-index:1;}
.viewer{padding:14px 16px;border:1px solid rgba(255,159,7,.22);background:rgba(0,0,0,.45);font-size:14px;line-height:1.7;letter-spacing:.04em;white-space:pre-wrap;color:var(--amberBright);min-height:260px;font-family:'VT323',monospace;font-size:17px;overflow-x:auto;}
.viewer.empty{display:flex;align-items:center;justify-content:center;color:var(--red);letter-spacing:.24em;opacity:.75;text-align:center;padding:40px 16px;font-family:'Share Tech Mono',monospace;font-size:12px;}
.viewer h1,.viewer h2,.viewer h3{color:var(--red);letter-spacing:.24em;font-weight:400;margin:8px 0 6px;font-family:'Share Tech Mono',monospace;}
.viewer .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px 14px;padding:8px 10px;margin-bottom:12px;border:1px dashed rgba(255,159,7,.25);background:rgba(0,0,0,.35);font-size:10px;letter-spacing:.16em;font-family:'Share Tech Mono',monospace;white-space:normal;}
.viewer .meta > div{display:flex;flex-direction:column;gap:2px;}
.viewer .meta .k{color:var(--red);letter-spacing:.22em;font-size:9px;}
.viewer .meta .v{color:var(--amberBright);text-shadow:0 0 3px rgba(255,159,7,.4);}

/* Password gate */
.gate{padding:26px 18px;text-align:center;}
.gate .icon{font-size:36px;color:var(--red);text-shadow:0 0 12px rgba(255,74,43,.5);margin-bottom:10px;}
.gate .msg{font-size:12px;letter-spacing:.22em;color:var(--amberBright);margin-bottom:18px;font-family:'Share Tech Mono',monospace;}
.gate input{font:inherit;padding:10px 12px;background:rgba(255,159,7,.06);border:1px solid rgba(255,74,43,.4);color:var(--amber);outline:none;letter-spacing:.14em;width:min(300px,80%);text-align:center;font-family:'Share Tech Mono',monospace;font-size:14px;}
.gate input:focus{border-color:var(--red);background:rgba(255,74,43,.1);}
.gate button{margin-top:10px;display:inline-block;font:inherit;padding:10px 16px;background:rgba(255,74,43,.1);border:1px solid rgba(255,74,43,.5);color:var(--red);letter-spacing:.22em;cursor:pointer;font-size:11px;font-family:'Share Tech Mono',monospace;min-height:44px;}
.gate button:hover,.gate button:focus{background:rgba(255,74,43,.22);color:#ffd0c1;outline:none;}
.gate .err{color:var(--red);font-size:11px;letter-spacing:.2em;margin-top:12px;min-height:1em;font-family:'Share Tech Mono',monospace;}

/* Footer / filter */
.footer{margin-top:12px;padding:10px 14px;border:1px dashed rgba(255,159,7,.25);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:10px;letter-spacing:.2em;color:var(--amberBright);opacity:.75;font-family:'Share Tech Mono',monospace;}
.footer .search{display:flex;align-items:center;gap:8px;flex:1;min-width:200px;}
.footer input{font:inherit;padding:8px 10px;background:rgba(255,159,7,.06);border:1px solid rgba(255,159,7,.3);color:var(--amber);outline:none;flex:1;letter-spacing:.12em;font-family:'Share Tech Mono',monospace;font-size:12px;min-height:36px;}
.footer input:focus{border-color:var(--amber);}
.footer .info{font-size:9px;}
</style>

<script id="main-script">
const $ = id => document.getElementById(id);

const state = {
    activeId: null,
    filter: '',
    unlocked: new Set(),
};

const list      = $('doc-list');
const viewer    = $('viewer-wrap');
const viewTitle = $('view-title');
const viewBadge = $('view-badge');
const search    = $('search');

function refreshHeader(){
    const total = DOCS.length;
    $('doc-count').textContent = total + ' POSTS';
    $('head-meta').textContent = total + ' DOCS · LAST SYNC 1989.03.15';
}

function iconFor(d){
    if(d.value === 1) return '◈';
    if(!d.body) return '□';
    return '≡';
}

function renderList(){
    const q = state.filter.trim().toLowerCase();
    list.innerHTML = '';
    let shown = 0;
    DOCS.forEach(d=>{
        if(q && !d.title.toLowerCase().includes(q) && !(d.tags||[]).join(' ').toLowerCase().includes(q)) return;
        shown++;
        const row = document.createElement('div');
        row.className = 'doc-row' + (d.value===1?' locked':'') + (state.activeId===d.id?' active':'');
        row.tabIndex = 0;
        row.innerHTML = `
            <span class="dico">${iconFor(d)}</span>
            <span class="dname">${escapeHTML(d.title)}</span>
            <span class="ddate">${escapeHTML(d.date||'--')}</span>
        `;
        row.addEventListener('click', ()=>openDoc(d.id));
        row.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDoc(d.id); } });
        list.appendChild(row);
    });
    if(!shown){
        list.innerHTML = '<div style="padding:14px;font-size:11px;letter-spacing:.2em;color:var(--red);opacity:.75;text-align:center;font-family:\'Share Tech Mono\',monospace;">// NO POSTS MATCH FILTER //</div>';
    }
}

function openDoc(id){
    const d = DOCS.find(x=>x.id===id);
    if(!d) return;
    state.activeId = id;
    document.querySelectorAll('.doc-row').forEach(r=>r.classList.remove('active'));
    renderList();
    viewTitle.textContent = d.title;
    viewBadge.textContent = d.value===1 ? 'LOCKED' : (d.body ? 'OPEN' : 'BLANK');

    if(d.value === 1 && !state.unlocked.has(d.id)){
        renderGate(d);
        return;
    }
    renderBody(d);
}

function renderBody(d){
    const meta = `
        <div class="meta">
            <div><span class="k">POSTED</span><span class="v">${escapeHTML(d.date||'--')}</span></div>
            <div><span class="k">AUTHOR</span><span class="v">${escapeHTML(d.author||'--')}</span></div>
            <div><span class="k">TAGS</span><span class="v">${escapeHTML((d.tags||[]).join(' · ')||'--')}</span></div>
            <div><span class="k">ACCESS</span><span class="v">${d.value===1?'RESTRICTED':'PUBLIC'}</span></div>
        </div>
    `;
    const body = d.body && d.body.trim()
        ? escapeHTML(d.body)
        : '<span style="color:var(--red);opacity:.6;">// THIS DOCUMENT IS BLANK — EDIT `body` IN THE DOCS ARRAY //</span>';
    viewer.innerHTML = `<div class="viewer">${meta}${body}</div>`;
}

function renderGate(d){
    viewer.innerHTML = `
        <div class="viewer" style="padding:0;">
            <div class="gate">
                <div class="icon">🔒</div>
                <div class="msg">DOCUMENT IS PASSWORD LOCKED<br/>ENTER ACCESS KEY</div>
                <div><input type="password" id="pw-in" placeholder="passphrase" autocomplete="off" inputmode="text"/></div>
                <div><button id="pw-go">UNLOCK ▸</button></div>
                <div class="err" id="pw-err"></div>
            </div>
        </div>
    `;
    const inp = $('pw-in');
    const err = $('pw-err');
    inp.focus();
    function attempt(){
        const v = (inp.value||'').trim();
        if(v.toUpperCase() === (d.password||'').toUpperCase()){
            state.unlocked.add(d.id);
            renderBody(d);
            viewBadge.textContent = 'UNLOCKED';
        } else {
            err.textContent = '△ INCORRECT KEY';
            inp.value = '';
            inp.focus();
        }
    }
    $('pw-go').addEventListener('click', attempt);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') attempt(); });
}

function escapeHTML(s){
    return String(s).replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

search.addEventListener('input', e=>{
    state.filter = e.target.value || '';
    renderList();
});

/* Boot */
refreshHeader();
renderList();
</script>
