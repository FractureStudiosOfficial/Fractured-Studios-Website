<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASS-DRIVER // Fractured Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
    --amber:#FF9F07;
    --amberBright:#FFC861;
    --amberDim:#B36700;
    --red:#ff4a2b;
    --green:#8fff8a;
    --violet:#c58bff;
    --scanBlack:#0a0603;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#000;overflow:hidden;}
body{color:var(--amber);font-family:'Share Tech Mono',monospace;perspective:1400px;user-select:none;}

/* === CRT bezel (site-consistent) === */
#bezel{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,#3a2a1a 0%,#1a120a 40%,#0a0705 70%,#000 100%);z-index:0;}
#bezel::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);pointer-events:none;}
#bezel-label{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:5;letter-spacing:.35em;font-size:11px;color:#7a5230;text-shadow:0 1px 0 #000;font-family:'VT323',monospace;user-select:none;}
#brand-led{position:fixed;bottom:16px;left:calc(50% - 180px);width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber),0 0 12px #ff6a00;animation:led-pulse 2.4s ease-in-out infinite;z-index:5;}
@keyframes led-pulse{0%,100%{opacity:.55;}50%{opacity:1;}}

#screen-wrap{position:fixed;inset:22px;border-radius:48px/60px;background:#050505;box-shadow:0 0 0 4px #0a0605,0 0 0 8px #1a0f07,0 0 0 10px #2a1a0d,0 0 40px rgba(0,0,0,.9) inset,0 30px 60px rgba(0,0,0,.85);overflow:hidden;isolation:isolate;}
#screen{position:absolute;inset:0;overflow:hidden;}

#glare{position:absolute;inset:0;pointer-events:none;z-index:1200;background:radial-gradient(ellipse 60% 45% at 28% 18%,rgba(255,255,255,.14),rgba(255,255,255,.03) 40%,transparent 70%),radial-gradient(ellipse 40% 30% at 78% 82%,rgba(255,159,7,.05),transparent 70%);mix-blend-mode:screen;}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:1100;background:radial-gradient(ellipse 90% 90% at 50% 50%,transparent 45%,rgba(0,0,0,.35) 75%,rgba(0,0,0,.9) 100%);}
#corners{position:absolute;inset:0;pointer-events:none;z-index:1105;background:radial-gradient(circle at 0% 0%,rgba(0,0,0,.85) 0,transparent 22%),radial-gradient(circle at 100% 0%,rgba(0,0,0,.85) 0,transparent 22%),radial-gradient(circle at 0% 100%,rgba(0,0,0,.85) 0,transparent 22%),radial-gradient(circle at 100% 100%,rgba(0,0,0,.85) 0,transparent 22%);}
#scanlines,#amber-tint,#rgb-mask,#roll{position:absolute;inset:0;pointer-events:none;}
#scanlines{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.35) 0px,rgba(0,0,0,.35) 1px,transparent 1px,transparent 3px);animation:flicker .14s infinite;z-index:1300;mix-blend-mode:multiply;}
#rgb-mask{background:repeating-linear-gradient(90deg,rgba(255,0,0,.05) 0 1px,rgba(0,255,0,.05) 1px 2px,rgba(0,0,255,.05) 2px 3px);z-index:1250;mix-blend-mode:overlay;opacity:.55;}
#roll{background:linear-gradient(180deg,transparent 0%,transparent 42%,rgba(255,255,255,.06) 47%,rgba(255,255,255,.10) 50%,rgba(255,255,255,.06) 53%,transparent 58%,transparent 100%);z-index:1310;mix-blend-mode:screen;animation:roll 9s linear infinite;}
@keyframes roll{0%{transform:translateY(-100%);}100%{transform:translateY(100%);}}
@keyframes flicker{0%{opacity:.55;}47%{opacity:.5;}50%{opacity:.85;}53%{opacity:.5;}100%{opacity:.55;}}
#amber-tint{background:radial-gradient(ellipse at 50% 50%,rgba(255,159,7,.03),rgba(255,80,0,.05) 80%);z-index:1150;mix-blend-mode:screen;}

/* === Cabinet layout === */
#stage{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:24px 30px;overflow:hidden;}

.hud{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
.hud .brand{font-size:22px;letter-spacing:.34em;color:var(--red);text-shadow:0 0 6px rgba(255,74,43,.6),0 0 16px rgba(255,74,43,.25);}
.hud .brand small{display:block;font-size:10px;letter-spacing:.28em;color:var(--amberBright);opacity:.75;margin-top:2px;}
.hud .stats{display:flex;gap:14px;flex-wrap:wrap;}
.stat{padding:6px 10px;border:1px solid rgba(255,159,7,.4);background:rgba(255,159,7,.05);font-size:12px;letter-spacing:.2em;}
.stat .k{color:var(--red);margin-right:6px;font-size:10px;}
.stat .v{color:var(--amberBright);text-shadow:0 0 4px rgba(255,159,7,.5);}
.stat.warn{border-color:rgba(255,74,43,.45);}
.stat.warn .v{color:var(--red);}

/* Panel like the rest of site */
.panel{position:relative;border:2px solid rgba(255,159,7,.45);background:linear-gradient(180deg,rgba(255,159,7,.05),rgba(0,0,0,.4));box-shadow:inset 0 0 24px rgba(255,159,7,.05),0 0 24px rgba(255,159,7,.06);border-radius:6px;overflow:hidden;}
.panel::before{content:"";position:absolute;inset:8px;border:1px dashed rgba(255,159,7,.18);pointer-events:none;border-radius:3px;}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#FF9F07,#FF9F07) 0 0/12px 2px no-repeat,linear-gradient(#FF9F07,#FF9F07) 0 0/2px 12px no-repeat,linear-gradient(#FF9F07,#FF9F07) 100% 0/12px 2px no-repeat,linear-gradient(#FF9F07,#FF9F07) 100% 0/2px 12px no-repeat,linear-gradient(#FF9F07,#FF9F07) 0 100%/12px 2px no-repeat,linear-gradient(#FF9F07,#FF9F07) 0 100%/2px 12px no-repeat,linear-gradient(#FF9F07,#FF9F07) 100% 100%/12px 2px no-repeat,linear-gradient(#FF9F07,#FF9F07) 100% 100%/2px 12px no-repeat;opacity:.7;}

/* Play field */
#field-wrap{flex:1;display:grid;grid-template-columns:1fr 300px;gap:14px;min-height:0;}
@media(max-width:1000px){#field-wrap{grid-template-columns:1fr;}}
#field{position:relative;padding:12px;min-height:0;}
#canvas{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);background:#050308;border:1px solid rgba(255,159,7,.3);image-rendering:pixelated;}

/* Side console */
#console{padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden;}
#console h3{margin:0 0 4px;font-size:12px;letter-spacing:.28em;color:var(--red);text-shadow:0 0 5px rgba(255,74,43,.4);border-bottom:1px dashed rgba(255,159,7,.3);padding-bottom:6px;}
.gauge{position:relative;padding:8px 10px;border:1px dashed rgba(255,159,7,.28);background:rgba(0,0,0,.35);}
.gauge .label{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.22em;color:var(--amberBright);margin-bottom:4px;}
.gauge .label .v{color:var(--amber);}
.bar{height:10px;background:rgba(255,159,7,.08);border:1px solid rgba(255,159,7,.25);position:relative;overflow:hidden;}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8b3a10,#ff9f07,#ffd48a);box-shadow:0 0 8px rgba(255,159,7,.5);transition:width .12s linear;}
.bar .fill.green{background:linear-gradient(90deg,#3a8b10,#8fff8a);box-shadow:0 0 8px rgba(143,255,138,.5);}
.bar .fill.red{background:linear-gradient(90deg,#8b1010,#ff4a2b);box-shadow:0 0 8px rgba(255,74,43,.5);}

.event-log{flex:1;min-height:80px;overflow-y:auto;font-family:'VT323',monospace;font-size:14px;letter-spacing:.04em;line-height:1.4;padding:6px 8px;background:rgba(0,0,0,.4);border:1px dashed rgba(255,159,7,.22);color:var(--amberBright);scrollbar-width:none;}
.event-log::-webkit-scrollbar{display:none;}
.event-log .ln{padding:1px 0;}
.event-log .ln.ok{color:var(--green);}
.event-log .ln.err{color:var(--red);}
.event-log .ln.warn{color:#ffb14a;}

.controls-hint{font-size:10px;letter-spacing:.16em;color:var(--amberBright);opacity:.7;line-height:1.55;}
.controls-hint .k{color:var(--red);}
.controls-hint kbd{border:1px solid rgba(255,159,7,.35);padding:0 5px;font-family:inherit;color:var(--amber);background:rgba(255,159,7,.05);}

/* Overlays — attract, pause, game over */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:30px;background:rgba(0,0,0,.55);backdrop-filter:blur(1px);}
.overlay.hidden{display:none;}
.overlay .box{max-width:640px;width:100%;padding:32px 38px;border:2px solid rgba(255,159,7,.55);background:linear-gradient(180deg,rgba(255,159,7,.06),rgba(0,0,0,.75));position:relative;text-align:center;box-shadow:0 0 40px rgba(255,159,7,.15);}
.overlay h1{margin:0 0 6px;font-size:36px;letter-spacing:.32em;color:var(--red);text-shadow:0 0 10px rgba(255,74,43,.55),0 0 24px rgba(255,74,43,.2);}
.overlay h2{margin:0 0 16px;font-size:14px;letter-spacing:.28em;color:var(--amberBright);opacity:.85;}
.overlay p{margin:6px 0;font-size:12px;letter-spacing:.14em;line-height:1.7;color:var(--amberBright);}
.overlay .cta{margin-top:16px;font-size:12px;letter-spacing:.28em;color:var(--amber);animation:tag-blink 1s steps(2) infinite;}
@keyframes tag-blink{50%{opacity:.35;}}
.overlay .footer-tag{margin-top:20px;font-size:10px;letter-spacing:.22em;color:var(--amberDim);}
.overlay .hs{margin-top:14px;padding:10px 14px;border:1px dashed rgba(255,159,7,.3);background:rgba(255,159,7,.03);font-family:'VT323',monospace;font-size:16px;line-height:1.35;color:var(--amberBright);}
.overlay .hs .row{display:flex;justify-content:space-between;padding:1px 0;}
.overlay .hs .row.you{color:var(--red);text-shadow:0 0 4px rgba(255,74,43,.4);}
.overlay .hs .rank{color:var(--red);width:30px;text-align:left;}
.overlay .hs .name{flex:1;text-align:left;letter-spacing:.14em;}
.overlay .hs .sc{width:80px;text-align:right;letter-spacing:.12em;}

/* Foot bar back button */
#foot-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:8px;border-top:1px dashed rgba(255,159,7,.25);}
.tool-btn{font-family:inherit;font-size:11px;letter-spacing:.22em;padding:7px 12px;background:rgba(255,159,7,.06);border:1px solid rgba(255,159,7,.4);color:var(--amberBright);cursor:pointer;text-shadow:0 0 4px rgba(255,159,7,.4);transition:background .12s;text-decoration:none;display:inline-block;}
.tool-btn:hover{background:rgba(255,159,7,.16);color:#fff2c1;border-color:var(--amberBright);}
.foot-note{margin-left:auto;font-size:10px;letter-spacing:.2em;color:var(--amberBright);opacity:.55;}
</style>
</head>
